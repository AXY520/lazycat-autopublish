application:
  subdomain: moviepilot
  multi_instance: true
  routes:
    - /=http://moviepilot:3000/

services:
  moviepilot:
    image: registry.lazycat.cloud/aixinyin/jxxghp/moviepilot:2f74064260711f82
    setup_script: |
      /bin/sh /lzcapp/pkg/content/setup.sh

    environment:
      PUID: "918"
      PGID: "918"
      UMASK: "022"
      PACKAGE_CACHE_ROOT: /moviepilot-cache/packages
      CLOAKBROWSER_CACHE_DIR: /moviepilot-cache/cloakbrowser
      TINI_SUBREAPER: "1"
      MOVIEPILOT_AUTO_UPDATE: "false"
      MOVIEPILOT_UPDATE_DEV: "false"
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/cache/moviepilot:/moviepilot-cache

ext_config:
  enable_document_access: true
  enable_media_access: true
